# Overlay: postgres. Unpublished and on the internal network only, so it is
# reachable from the claude container and from nowhere else — not the host,
# not the internet.
#
# CCIC_PG_DATA_MOUNT is version-dependent and MUST be computed by the caller:
#   postgres <= 17 : /var/lib/postgresql/data
#   postgres >= 18 : /var/lib/postgresql      (the image now owns the layout
#                    below this path, placing data in a major-version
#                    subdirectory so `pg_upgrade --link` can work; mounting the
#                    old path makes 18+ refuse to initialise)
# See https://github.com/docker-library/postgres/pull/1259

services:
  db:
    image: postgres:${CCIC_PG_VERSION:-18}-bookworm
    networks:
      - internal
    environment:
      POSTGRES_USER: ${CCIC_PG_USER:-postgres}
      POSTGRES_PASSWORD: ${CCIC_PG_PASSWORD:-postgres}
      POSTGRES_DB: ${CCIC_PG_DATABASE}
    volumes:
      - pgdata:${CCIC_PG_DATA_MOUNT:-/var/lib/postgresql}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CCIC_PG_USER:-postgres}"]
      interval: 2s
      timeout: 3s
      retries: 30

  claude:
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${CCIC_PG_USER:-postgres}:${CCIC_PG_PASSWORD:-postgres}@db:5432/${CCIC_PG_DATABASE}
      PGHOST: db
      PGUSER: ${CCIC_PG_USER:-postgres}
      PGPASSWORD: ${CCIC_PG_PASSWORD:-postgres}
      PGDATABASE: ${CCIC_PG_DATABASE}

volumes:
  pgdata:
