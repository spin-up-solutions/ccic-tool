# GoReleaser builds the cross-platform binaries, publishes them to GitHub
# Releases and (optionally) updates a Homebrew tap.
#
#   goreleaser check           validate this file
#   goreleaser release --snapshot --clean --skip=publish   dry run, no tag needed
#
# A real release is driven by pushing a tag; see .github/workflows/release.yml.
version: 2

project_name: ccic

before:
  hooks:
    - go mod tidy

builds:
  - id: ccic
    main: ./cmd/ccic
    binary: ccic
    env:
      # ccic shells out to the docker CLI and needs no cgo, so a fully static
      # binary works on every target and cross-compiles without a toolchain.
      - CGO_ENABLED=0
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/spin-up-solutions/ccic-tool/internal/cli.Version={{ .Version }}
      - -X github.com/spin-up-solutions/ccic-tool/internal/cli.Commit={{ .ShortCommit }}
      - -X github.com/spin-up-solutions/ccic-tool/internal/cli.BuildDate={{ .Date }}

archives:
  - id: ccic
    formats: [tar.gz]
    # `ccic upgrade` derives this name from runtime.GOOS/GOARCH, so changing the
    # template breaks self-update for every already-installed binary.
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ .Tag }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"

release:
  draft: false
  prerelease: auto
  footer: |
    ## Install

    macOS:

    ```sh
    brew install spin-up-solutions/tap/ccic
    ```

    macOS or Linux:

    ```sh
    curl -fsSL https://raw.githubusercontent.com/spin-up-solutions/ccic-tool/main/install.sh | sh
    ```

    Already have ccic? `ccic upgrade`.

# Homebrew tap.
#
#   brew install spin-up-solutions/tap/ccic
#
# `brews` (formulae) is deprecated in GoReleaser v2; `homebrew_casks` is the
# current form, as is `binaries` in place of `binary`. The generated cask does
# carry Linux URLs, but Homebrew's cask support on Linux is limited, so
# install.sh is the path we point Linux users at.
#
# Requires a TAP_GITHUB_TOKEN secret with write access to the tap repository,
# because a workflow's GITHUB_TOKEN is scoped to its own repository and cannot
# push to another one. To release without touching the tap, pass
# `--skip=homebrew`.
#
# NOTE: `goreleaser check` validates the schema but does NOT execute templates,
# and `--snapshot` skips publishing, so neither exercises this token field. A
# bad template here only shows up in a real release — after the binaries have
# already been uploaded. Keep it to the plain `.Env` form.
homebrew_casks:
  - name: ccic
    repository:
      owner: spin-up-solutions
      name: homebrew-tap
      branch: main
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    directory: Casks
    homepage: https://github.com/spin-up-solutions/ccic-tool
    description: Run Claude Code in a container, isolated from your dev environment
    binaries: [ccic]
    hooks:
      post:
        # The binary is not notarised, so macOS quarantines it on download and
        # Gatekeeper refuses to run it. Stripping the attribute at install time
        # is what makes `brew install` a one-step experience.
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr",
                           args: ["-dr", "com.apple.quarantine", "#{staged_path}/ccic"]
          end
